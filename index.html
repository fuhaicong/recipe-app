<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
  <meta name="theme-color" content="#FDF8F3">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>今天吃什么</title>
  <link rel="stylesheet" href="css/style.css?v=15">
  <svg style="display:none" aria-hidden="true"><defs>
    <symbol id="icon-sun" viewBox="0 0 32 32"><circle cx="16" cy="16" r="6" fill="currentColor"/><g stroke="currentColor" stroke-width="1.5" opacity="0.5"><line x1="16" y1="2" x2="16" y2="5"/><line x1="16" y1="27" x2="16" y2="30"/><line x1="2" y1="16" x2="5" y2="16"/><line x1="27" y1="16" x2="30" y2="16"/></g></symbol>
    <symbol id="icon-cloud" viewBox="0 0 32 32"><path d="M8 18a5 5 0 0 1 0-10 6.5 6.5 0 0 1 12-3 4.5 4.5 0 0 1 4 8" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></symbol>
    <symbol id="icon-rain" viewBox="0 0 32 32"><path d="M7 14a4 4 0 0 1 0-8 5.5 5.5 0 0 1 10-2.5A3.5 3.5 0 0 1 20 10" fill="none" stroke="currentColor" stroke-width="2"/><line x1="10" y1="16" x2="8" y2="22" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/><line x1="15" y1="16" x2="13" y2="22" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/><line x1="20" y1="16" x2="18" y2="22" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></symbol>
    <symbol id="icon-snow" viewBox="0 0 32 32"><path d="M7 12a4 4 0 0 1 0-8 5.5 5.5 0 0 1 10-2.5A3.5 3.5 0 0 1 20 8" fill="none" stroke="currentColor" stroke-width="2"/><circle cx="10" cy="17" r="1.2" fill="currentColor"/><circle cx="15.5" cy="18.5" r="1.2" fill="currentColor"/><circle cx="20" cy="17" r="1.2" fill="currentColor"/></symbol>
    <symbol id="icon-storm" viewBox="0 0 32 32"><path d="M7 12a4 4 0 0 1 0-8 5.5 5.5 0 0 1 10-2.5A3.5 3.5 0 0 1 20 8" fill="none" stroke="currentColor" stroke-width="2"/><polyline points="14,14 11,18 14,18 12,22" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></symbol>
    <symbol id="icon-mist" viewBox="0 0 32 32"><line x1="6" y1="11" x2="26" y2="11" stroke="currentColor" stroke-width="1.5" opacity="0.5"/><line x1="8" y1="15" x2="24" y2="15" stroke="currentColor" stroke-width="1.5" opacity="0.4"/><line x1="5" y1="19" x2="27" y2="19" stroke="currentColor" stroke-width="1.5" opacity="0.5"/></symbol>
    <symbol id="icon-pin" viewBox="0 0 16 16"><path d="M8 1.5C5.5 1.5 3.5 3.7 3.5 6.3c0 3.4 4.5 8.2 4.5 8.2s4.5-4.8 4.5-8.2C12.5 3.7 10.5 1.5 8 1.5Z" fill="none" stroke="currentColor" stroke-width="1.5"/><circle cx="8" cy="6" r="2" fill="none" stroke="currentColor" stroke-width="1.5"/></symbol>
    <symbol id="icon-refresh" viewBox="0 0 18 18"><path d="M15 3v4h-4M3 15v-4h4" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M2 9a7 7 0 0 1 12.3-4.5M4.3 13.5A7 7 0 0 0 16 9" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></symbol>
    <symbol id="icon-copy" viewBox="0 0 16 16"><rect x="5" y="5" width="8" height="8" rx="1.5" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M3 11V3.5A1.5 1.5 0 0 1 4.5 2H11" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></symbol>
    <symbol id="icon-search" viewBox="0 0 16 16"><circle cx="7" cy="7" r="5" fill="none" stroke="currentColor" stroke-width="1.5"/><line x1="10.8" y1="10.8" x2="14" y2="14" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></symbol>
    <symbol id="icon-plus" viewBox="0 0 18 18"><line x1="9" y1="3" x2="9" y2="15" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><line x1="3" y1="9" x2="15" y2="9" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></symbol>
    <symbol id="icon-book" viewBox="0 0 18 18"><path d="M2 3h5l3 2h6v10H2V3Z" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/></symbol>
    <symbol id="icon-x" viewBox="0 0 18 18"><line x1="4" y1="4" x2="14" y2="14" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><line x1="14" y1="4" x2="4" y2="14" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></symbol>
    <symbol id="icon-clock" viewBox="0 0 16 16"><circle cx="8" cy="8" r="7" fill="none" stroke="currentColor" stroke-width="1.5"/><polyline points="8,4 8,8 11.5,10" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="icon-chef" viewBox="0 0 16 16"><path d="M3 10h10v3.5H3V10Z" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M3.5 10c0-2.5.5-4 4.5-4s4.5 1.5 4.5 4" fill="none" stroke="currentColor" stroke-width="1.5"/><circle cx="8" cy="3.5" r="2.5" fill="none" stroke="currentColor" stroke-width="1.5"/></symbol>
  </defs></svg>
</head>
<body>
  <div id="app">
    <!-- === TOP BAR: Weather + Location === -->
    <div id="top-bar" class="top-bar">
      <div class="top-bar-left">
        <span id="top-weather-icon" class="top-weather-icon">
          <svg width="28" height="28"><use href="#icon-sun"/></svg>
        </span>
        <span id="top-temp" class="top-temp">--°</span>
        <span id="top-weather-desc" class="top-weather-desc">--</span>
      </div>
      <button id="top-city" class="top-city" title="点击修改城市">
        <svg width="12" height="12"><use href="#icon-pin"/></svg>
        <span id="top-city-name">北京</span>
        <svg width="10" height="10" style="opacity:0.4" viewBox="0 0 16 16"><path d="M5 7l3 3 3-3" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      </button>
      <div class="top-bar-right">
        <button id="btn-browse2" class="top-btn" title="浏览菜谱">
          <svg width="17" height="17"><use href="#icon-book"/></svg>
        </button>
        <button id="btn-refresh2" class="top-btn" title="换一批">
          <svg width="17" height="17"><use href="#icon-refresh"/></svg>
        </button>
      </div>
    </div>

    <!-- === City edit popup === -->
    <div id="city-edit" class="city-edit" hidden>
      <input type="text" id="city-edit-input" class="city-edit-input" placeholder="输入城市名" autocomplete="off">
      <button id="city-edit-ok" class="btn btn-sm btn-primary">确定</button>
      <button id="city-edit-close" class="btn btn-sm btn-secondary">取消</button>
    </div>

    <!-- === CURRENT MEAL HEADER === -->
    <div id="meal-header" class="meal-header">
      <span id="meal-header-icon" class="meal-header-icon">🌤️</span>
      <div>
        <div id="meal-header-title" class="meal-header-title">现在是午餐时间</div>
        <div id="meal-header-sub" class="meal-header-sub">为你推荐以下三道菜</div>
      </div>
    </div>

    <!-- === 3 CURRENT MEAL RECIPES === -->
    <div id="current-recipes" class="current-recipes">
      <!-- JS fills 3 cards here -->
    </div>

    <!-- === FULL DAY RECOMMENDATIONS === -->
    <h3 id="day-title" class="section-title">全天推荐</h3>
    <div id="day-recipes" class="day-recipes">
      <!-- JS fills 3 cards: 早餐/午餐/晚餐 -->
    </div>

    <!-- === ACTION BAR === -->
    <div class="action-bar">
      <button id="btn-browse" class="btn btn-secondary">
        <svg width="15" height="15"><use href="#icon-book"/></svg> 全部菜谱
      </button>
      <button id="btn-refresh" class="btn btn-primary" style="flex:1">
        <svg width="16" height="16"><use href="#icon-refresh"/></svg> 换一批
      </button>
      <button id="fab-add" class="btn btn-secondary" title="添加菜谱">
        <svg width="16" height="16"><use href="#icon-plus"/></svg>
      </button>
    </div>

    <!-- === TAKEOUT === -->
    <section id="takeout-section" class="takeout-section" hidden>
      <div class="takeout-divider"><span>想点外卖</span></div>
      <div id="takeout-keywords" class="takeout-keywords"></div>
      <button id="btn-copy-keywords" class="btn btn-secondary btn-block">
        <svg width="14" height="14"><use href="#icon-copy"/></svg> 复制关键词
      </button>
    </section>

    <!-- === ERROR === -->
    <div id="error-banner" class="error-banner" hidden role="alert"></div>
  </div>

  <!-- === BROWSE OVERLAY === -->
  <div id="browse-overlay" class="overlay" hidden>
    <div class="overlay-header">
      <h2 class="overlay-title">全部菜谱 <span id="browse-count" class="browse-count"></span></h2>
      <button id="btn-close-browse" class="btn-icon"><svg width="20" height="20"><use href="#icon-x"/></svg></button>
    </div>
    <div class="overlay-search">
      <svg width="15" height="15" class="search-icon"><use href="#icon-search"/></svg>
      <input type="search" id="browse-search" class="search-input" placeholder="搜索菜名或食材..." autocomplete="off">
    </div>
    <div id="browse-tags" class="browse-tags"></div>
    <div id="browse-list" class="browse-list"></div>
    <div id="browse-load-more" class="browse-load-more" hidden>
      <button id="btn-load-more" class="btn btn-secondary btn-block">加载更多</button>
    </div>
    <div id="browse-empty" class="browse-empty" hidden>没有找到匹配的菜谱</div>
  </div>

  <!-- === ADD RECIPE MODAL === -->
  <div id="add-modal" class="overlay" hidden>
    <div class="overlay-header">
      <h2 class="overlay-title">添加我的菜谱</h2>
      <button id="btn-close-add" class="btn-icon"><svg width="20" height="20"><use href="#icon-x"/></svg></button>
    </div>
    <form id="add-form" class="add-form">
      <label class="form-label">菜名 <span class="required">*</span></label>
      <input type="text" id="add-name" class="form-input" placeholder="例如：妈妈的番茄牛腩" required>
      <label class="form-label">一句话描述</label>
      <input type="text" id="add-desc" class="form-input" placeholder="例如：酸甜浓郁，牛腩入口即化">
      <label class="form-label">食材清单 <span class="required">*</span></label>
      <textarea id="add-ingredients" class="form-textarea" rows="4" placeholder="每行一个食材" required></textarea>
      <label class="form-label">做法步骤 <span class="required">*</span></label>
      <textarea id="add-steps" class="form-textarea" rows="4" placeholder="每行一个步骤" required></textarea>
      <div class="form-row">
        <div class="form-col"><label class="form-label">时间(分钟)</label><input type="number" id="add-time" class="form-input" value="20" min="1" max="300"></div>
        <div class="form-col"><label class="form-label">难度</label><select id="add-difficulty" class="form-input"><option value="easy">简单</option><option value="medium" selected>中等</option><option value="hard">挑战</option></select></div>
      </div>
      <label class="form-label">外卖关键词(逗号分隔)</label>
      <input type="text" id="add-takeout" class="form-input" placeholder="牛腩,番茄牛腩饭">
      <button type="submit" class="btn btn-primary btn-block">保存菜谱</button>
    </form>
  </div>

  <footer class="app-footer"><p>每日食谱 · 好好吃饭</p></footer>

  <script src="js/recipes.js?v=15"></script>
  <script src="js/weather.js?v=15"></script>
  <script src="js/ui.js?v=15"></script>
  <script src="js/app.js?v=15"></script>
</body>
</html>
